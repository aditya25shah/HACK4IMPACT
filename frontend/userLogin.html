<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Sign in</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root{
      --bg-primary:#050714;
      --bg-secondary:#0a0f1e;
      --accent:#a855f7;
      --accent-hover:#9333ea;
      --text-primary:#f8fafc;
      --text-secondary:#94a3b8;
      --border:#1e293b;
      --success:#10b981;
      --error:#ef4444;
      --glow:rgba(168, 85, 247, 0.3);
    }
    
    *{box-sizing:border-box;margin:0;padding:0}
    
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#050714;
      color:var(--text-primary);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      position:relative;
      overflow:hidden;
    }
    
    body::before{
      content:'';
      position:fixed;
      top:-50%;
      left:-50%;
      width:200%;
      height:200%;
      background:radial-gradient(circle at 30% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
                 radial-gradient(circle at 70% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
      animation:drift 20s ease-in-out infinite;
      z-index:0;
    }
    
    @keyframes drift{
      0%, 100%{transform:translate(0, 0) rotate(0deg)}
      33%{transform:translate(30px, -30px) rotate(5deg)}
      66%{transform:translate(-20px, 20px) rotate(-5deg)}
    }
    
    .container{
      position:relative;
      z-index:1;
      width:100%;
      max-width:460px;
    }
    
    .card{
      background:rgba(10, 15, 30, 0.7);
      backdrop-filter:blur(20px);
      border-radius:24px;
      border:1px solid rgba(255,255,255,0.08);
      padding:48px 40px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5),
                 0 0 100px rgba(168, 85, 247, 0.1);
      position:relative;
      overflow:hidden;
    }
    
    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity:0.5;
    }
    
    .panel{
      animation:fadeIn 0.4s ease;
    }
    
    .panel.hidden{
      display:none;
    }
    
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    
    .header{
      text-align:center;
      margin-bottom:36px;
    }
    
    h1{
      font-size:32px;
      font-weight:700;
      background:linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:8px;
      letter-spacing:-0.02em;
    }
    
    .subtitle{
      color:var(--text-secondary);
      font-size:15px;
      font-weight:400;
    }
    
    form{
      width:100%;
    }
    
    .field{
      margin-bottom:20px;
    }
    
    label{
      display:block;
      font-size:14px;
      font-weight:500;
      color:var(--text-secondary);
      margin-bottom:8px;
    }
    
    input{
      width:100%;
      padding:14px 16px;
      border-radius:12px;
      border:1.5px solid var(--border);
      background:rgba(15, 23, 42, 0.5);
      color:var(--text-primary);
      font-size:15px;
      font-family:inherit;
      transition:all 0.3s ease;
      outline:none;
    }
    
    input:focus{
      border-color:var(--accent);
      background:rgba(15, 23, 42, 0.8);
      box-shadow:0 0 0 4px rgba(168, 85, 247, 0.1);
    }
    
    input::placeholder{
      color:#475569;
    }
    
    .actions{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:28px;
    }
    
    button{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:none;
      font-size:15px;
      font-weight:600;
      font-family:inherit;
      cursor:pointer;
      transition:all 0.3s ease;
      position:relative;
      overflow:hidden;
    }
    
    button::before{
      content:'';
      position:absolute;
      top:50%;
      left:50%;
      width:0;
      height:0;
      border-radius:50%;
      background:rgba(255,255,255,0.1);
      transform:translate(-50%, -50%);
      transition:width 0.6s, height 0.6s;
    }
    
    button:hover::before{
      width:300px;
      height:300px;
    }
    
    .btn-primary{
      background:linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      color:white;
      box-shadow:0 4px 16px rgba(168, 85, 247, 0.3);
      position:relative;
    }
    
    .btn-primary:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(168, 85, 247, 0.4);
    }
    
    .btn-primary:active{
      transform:translateY(0);
    }
    
    .btn-ghost{
      background:transparent;
      border:1.5px solid var(--border);
      color:var(--text-secondary);
    }
    
    .btn-ghost:hover{
      border-color:var(--accent);
      color:var(--text-primary);
      background:rgba(168, 85, 247, 0.05);
    }
    
    .message{
      margin-top:16px;
      padding:12px 16px;
      border-radius:10px;
      font-size:14px;
      font-weight:500;
      text-align:center;
      animation:slideIn 0.3s ease;
    }
    
    @keyframes slideIn{
      from{opacity:0;transform:translateY(-10px)}
      to{opacity:1;transform:translateY(0)}
    }
    
    .success{
      background:rgba(16, 185, 129, 0.1);
      color:var(--success);
      border:1px solid rgba(16, 185, 129, 0.2);
    }
    
    .error{
      background:rgba(239, 68, 68, 0.1);
      color:var(--error);
      border:1px solid rgba(239, 68, 68, 0.2);
    }
    
    .divider{
      display:flex;
      align-items:center;
      gap:16px;
      margin:24px 0;
      color:var(--text-secondary);
      font-size:13px;
    }
    
    .divider::before,
    .divider::after{
      content:'';
      flex:1;
      height:1px;
      background:var(--border);
    }
    
    .footer-note{
      text-align:center;
      margin-top:24px;
      color:var(--text-secondary);
      font-size:12px;
      opacity:0.7;
    }
    
    .icon{
      width:20px;
      height:20px;
      display:inline-block;
      vertical-align:middle;
      margin-right:8px;
    }
    
    @media (max-width:520px){
      .card{
        padding:36px 28px;
      }
      h1{
        font-size:28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Login Panel -->
      <div class="panel" id="loginPanel">
        <div class="header">
          <h1>Welcome Back</h1>
          <p class="subtitle">Sign in to continue to your account</p>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="loginName">Full Name</label>
            <input id="loginName" type="text" placeholder="Enter your name" required />
          </div>
          <div class="field">
            <label for="loginMobile">Mobile Number</label>
            <input id="loginMobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="Enter your password" required />
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">
              <span style="position:relative">Sign In</span>
            </button>
            <button type="button" id="toSignup" class="btn-ghost">
              <span style="position:relative">Create New Account</span>
            </button>
          </div>
          <div id="loginMsg"></div>
        </form>
      </div>

      <!-- Signup Panel -->
      <div class="panel hidden" id="signupPanel">
        <div class="header">
          <h1>Create Account</h1>
          <p class="subtitle">Join us today, it only takes a minute</p>
        </div>

        <form id="signupForm">
          <div class="field">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Enter your full name" required />
          </div>
          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number" required />
          </div>
          <div class="field">
            <label for="email">Email Address (Optional)</label>
            <input id="email" type="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Minimum 6 characters" required />
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">
              <span style="position:relative">Create Account</span>
            </button>
            <button type="button" id="toLogin" class="btn-ghost">
              <span style="position:relative">Already Have Account</span>
            </button>
          </div>
          <div id="signupMsg"></div>
        </form>
      </div>
    </div>
    
    <div class="footer-note">🔒 Demo app - Data stored in memory only</div>
  </div>

  <script>
    const users = {};

    function showMsg(el, text, ok = true){
      el.textContent = text;
      el.className = 'message ' + (ok ? 'success' : 'error');
    }

    async function hashPassword(password){
      const enc = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) =>{
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('signupMsg');

      if(name.length < 2) return showMsg(msgEl, '❌ Please enter your full name', false);
      if(!/^\d{10}$/.test(mobile)) return showMsg(msgEl, '❌ Enter a valid 10-digit mobile number', false);
      if(password.length < 6) return showMsg(msgEl, '❌ Password must be at least 6 characters', false);

      if(users[mobile]) return showMsg(msgEl, '❌ Mobile number already registered. Please login.', false);

      const hashed = await hashPassword(password);
      users[mobile] = {name, mobile, email: email || null, pwd: hashed, createdAt: new Date().toISOString()};
      showMsg(msgEl, '✅ Account created successfully! Redirecting to login...');

      document.getElementById('signupForm').reset();
      setTimeout(() => {
        document.getElementById('loginMobile').value = mobile;
        document.getElementById('toLogin').click();
      }, 1500);
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) =>{
      e.preventDefault();
      const mobile = document.getElementById('loginMobile').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msgEl = document.getElementById('loginMsg');

      if(!/^\d{10}$/.test(mobile)) return showMsg(msgEl, '❌ Enter a valid 10-digit mobile number', false);
      if(password.length < 1) return showMsg(msgEl, '❌ Please enter your password', false);

      const user = users[mobile];
      if(!user) return showMsg(msgEl, '❌ No account found. Please sign up first.', false);

      const hashed = await hashPassword(password);
      if(hashed !== user.pwd) return showMsg(msgEl, '❌ Incorrect password. Try again.', false);

      showMsg(msgEl, `✅ Welcome back, ${user.name}!`);
      console.log('Logged in:', user);
    });

    // Toggle panels
    document.getElementById('toSignup').addEventListener('click', ()=>{
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('signupPanel').classList.remove('hidden');
      document.getElementById('name').focus();
    });
    
    document.getElementById('toLogin').addEventListener('click', ()=>{
      document.getElementById('signupPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
      document.getElementById('loginMobile').focus();
    });
  </script>
</body>
</html>
