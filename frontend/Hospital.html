<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .error-message {
            color: #f87171;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-group.error input {
            border-color: #f87171;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.2);
            border-color: rgba(71, 85, 105, 0.7);
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 20px;
        }

        .footer p {
            color: #64748b;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: #86efac;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .hidden {
            display: none;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <div class="success-message" id="loginSuccessMsg"></div>

        <div>
            <div class="form-group" id="loginHospitalGroup">
                <label for="loginHospital">Hospital Name</label>
                <input type="text" id="loginHospital" placeholder="Enter hospital name">
                <div class="error-message" id="loginHospitalError"></div>
            </div>

            <div class="form-group" id="loginLicenseGroup">
                <label for="loginLicense">License Number</label>
                <input type="text" id="loginLicense" placeholder="Enter license number">
                <div class="error-message" id="loginLicenseError"></div>
            </div>

            <div class="form-group" id="loginPasswordGroup">
                <label for="loginPassword">Security Key</label>
                <input type="password" id="loginPassword" placeholder="Enter security key">
                <div class="error-message" id="loginPasswordError"></div>
            </div>

            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
            <button class="btn-secondary" onclick="showSignup()">Create New Account</button>
        </div>

        <div class="footer">
            <p>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Demo app - Data stored in memory only
            </p>
        </div>
    </div>

    <div class="container hidden" id="signupContainer">
        <div class="header">
            <h1>Create Account</h1>
            <p>Register your hospital to get started</p>
        </div>

        <div class="success-message" id="signupSuccessMsg"></div>

        <div>
            <div class="form-group" id="signupHospitalGroup">
                <label for="signupHospital">Hospital Name *</label>
                <input type="text" id="signupHospital" placeholder="Enter hospital name">
                <div class="error-message" id="signupHospitalError"></div>
            </div>

            <div class="form-group" id="signupLicenseGroup">
                <label for="signupLicense">License Number *</label>
                <input type="text" id="signupLicense" placeholder="Enter license number">
                <div class="error-message" id="signupLicenseError"></div>
            </div>

            <div class="form-group" id="signupContactGroup">
                <label for="signupContact">Contact Person *</label>
                <input type="text" id="signupContact" placeholder="Full name">
                <div class="error-message" id="signupContactError"></div>
            </div>

            <div class="two-column">
                <div class="form-group" id="signupEmailGroup">
                    <label for="signupEmail">Email Address *</label>
                    <input type="email" id="signupEmail" placeholder="hospital@example.com">
                    <div class="error-message" id="signupEmailError"></div>
                </div>

                <div class="form-group" id="signupPhoneGroup">
                    <label for="signupPhone">Phone Number *</label>
                    <input type="tel" id="signupPhone" placeholder="10-digit number">
                    <div class="error-message" id="signupPhoneError"></div>
                </div>
            </div>

            <div class="form-group" id="signupAddressGroup">
                <label for="signupAddress">Address *</label>
                <input type="text" id="signupAddress" placeholder="Full hospital address">
                <div class="error-message" id="signupAddressError"></div>
            </div>

            <div class="two-column">
                <div class="form-group" id="signupPasswordGroup">
                    <label for="signupPassword">Password *</label>
                    <input type="password" id="signupPassword" placeholder="Min 8 characters">
                    <div class="error-message" id="signupPasswordError"></div>
                </div>

                <div class="form-group" id="signupConfirmGroup">
                    <label for="signupConfirm">Confirm Password *</label>
                    <input type="password" id="signupConfirm" placeholder="Re-enter password">
                    <div class="error-message" id="signupConfirmError"></div>
                </div>
            </div>

            <button class="btn-primary" onclick="handleSignup()">Register Hospital</button>
            <button class="btn-secondary" onclick="showLogin()">Already have an account? Sign In</button>
        </div>

        <div class="footer">
            <p>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Demo app - Data stored in memory only
            </p>
        </div>
    </div>

    <script>
        var hospitals = [];

        function showLogin() {
            document.getElementById('loginContainer').classList.remove('hidden');
            document.getElementById('signupContainer').classList.add('hidden');
            clearLoginForm();
        }

        function showSignup() {
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('signupContainer').classList.remove('hidden');
            clearSignupForm();
        }

        function clearLoginForm() {
            document.getElementById('loginHospital').value = '';
            document.getElementById('loginLicense').value = '';
            document.getElementById('loginPassword').value = '';
            clearErrors('login');
            document.getElementById('loginSuccessMsg').classList.remove('show');
        }

        function clearSignupForm() {
            document.getElementById('signupHospital').value = '';
            document.getElementById('signupLicense').value = '';
            document.getElementById('signupContact').value = '';
            document.getElementById('signupEmail').value = '';
            document.getElementById('signupPhone').value = '';
            document.getElementById('signupAddress').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirm').value = '';
            clearErrors('signup');
            document.getElementById('signupSuccessMsg').classList.remove('show');
        }

        function clearErrors(type) {
            var container = type === 'login' ? 'loginContainer' : 'signupContainer';
            var formGroups = document.querySelectorAll('#' + container + ' .form-group');
            for (var i = 0; i < formGroups.length; i++) {
                var group = formGroups[i];
                group.classList.remove('error');
                var errorMsg = group.querySelector('.error-message');
                if (errorMsg) {
                    errorMsg.classList.remove('show');
                    errorMsg.textContent = '';
                }
            }
        }

        function showError(fieldId, message) {
            var group = document.getElementById(fieldId + 'Group');
            var errorMsg = document.getElementById(fieldId + 'Error');
            if (group && errorMsg) {
                group.classList.add('error');
                errorMsg.textContent = message;
                errorMsg.classList.add('show');
            }
        }

        function handleLogin() {
            clearErrors('login');

            var hospitalName = document.getElementById('loginHospital').value.trim();
            var license = document.getElementById('loginLicense').value.trim();
            var password = document.getElementById('loginPassword').value.trim();

            var hasError = false;

            if (!hospitalName) {
                showError('loginHospital', 'Hospital name is required');
                hasError = true;
            }
            if (!license) {
                showError('loginLicense', 'License number is required');
                hasError = true;
            }
            if (!password) {
                showError('loginPassword', 'Security key is required');
                hasError = true;
            }

            if (hasError) return;

            var hospital = null;
            for (var i = 0; i < hospitals.length; i++) {
                var h = hospitals[i];
                if (h.hospitalName.toLowerCase() === hospitalName.toLowerCase() &&
                    h.license === license &&
                    h.password === password) {
                    hospital = h;
                    break;
                }
            }

            if (!hospital) {
                var hospitalExists = null;
                for (var i = 0; i < hospitals.length; i++) {
                    var h = hospitals[i];
                    if (h.hospitalName.toLowerCase() === hospitalName.toLowerCase() &&
                        h.license === license) {
                        hospitalExists = h;
                        break;
                    }
                }

                if (hospitalExists) {
                    showError('loginPassword', 'Incorrect security key');
                } else {
                    showError('loginHospital', 'Hospital not found. Please sign up first.');
                    showError('loginLicense', 'Hospital not registered with this license.');
                }
                return;
            }

            sessionStorage.setItem('currentHospital', JSON.stringify(hospital));
            sessionStorage.setItem('isAuthenticated', 'true');
            
            var successMsg = document.getElementById('loginSuccessMsg');
            successMsg.textContent = '✓ Login successful! Welcome back, ' + hospital.hospitalName;
            successMsg.classList.add('show');

            setTimeout(function() {
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        function handleSignup() {
            clearErrors('signup');

            var hospitalName = document.getElementById('signupHospital').value.trim();
            var license = document.getElementById('signupLicense').value.trim();
            var contact = document.getElementById('signupContact').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var phone = document.getElementById('signupPhone').value.trim();
            var address = document.getElementById('signupAddress').value.trim();
            var password = document.getElementById('signupPassword').value;
            var confirm = document.getElementById('signupConfirm').value;

            var hasError = false;

            if (!hospitalName) {
                showError('signupHospital', 'Hospital name is required');
                hasError = true;
            }
            if (!license) {
                showError('signupLicense', 'License number is required');
                hasError = true;
            }
            if (!contact) {
                showError('signupContact', 'Contact person is required');
                hasError = true;
            }
            if (!email) {
                showError('signupEmail', 'Email is required');
                hasError = true;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                showError('signupEmail', 'Email is invalid');
                hasError = true;
            }
            if (!phone) {
                showError('signupPhone', 'Phone number is required');
                hasError = true;
            } else if (!/^\d{10}$/.test(phone.replace(/\s/g, ''))) {
                showError('signupPhone', 'Enter valid 10-digit number');
                hasError = true;
            }
            if (!address) {
                showError('signupAddress', 'Address is required');
                hasError = true;
            }
            if (!password) {
                showError('signupPassword', 'Password is required');
                hasError = true;
            } else if (password.length < 8) {
                showError('signupPassword', 'Password must be at least 8 characters');
                hasError = true;
            }
            if (password !== confirm) {
                showError('signupConfirm', 'Passwords do not match');
                hasError = true;
            }

            if (hasError) return;

            var exists = null;
            for (var i = 0; i < hospitals.length; i++) {
                var h = hospitals[i];
                if (h.hospitalName.toLowerCase() === hospitalName.toLowerCase() &&
                    h.license === license) {
                    exists = h;
                    break;
                }
            }

            if (exists) {
                showError('signupHospital', 'This hospital is already registered');
                showError('signupLicense', 'This license number is already registered');
                return;
            }

            var newHospital = {
                hospitalName: hospitalName,
                license: license,
                contact: contact,
                email: email,
                phone: phone,
                address: address,
                password: password,
                registeredAt: new Date().toISOString()
            };

            hospitals.push(newHospital);

            var successMsg = document.getElementById('signupSuccessMsg');
            successMsg.textContent = '✓ Registration successful! Redirecting to login...';
            successMsg.classList.add('show');

            setTimeout(function() {
                showLogin();
                document.getElementById('loginHospital').value = hospitalName;
                document.getElementById('loginLicense').value = license;
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginContainer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('signupContainer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSignup();
            });
        });
    </script>
</body>
</html>
